<!--
====================================================================
 AMI'S PROPERTIES — STANDALONE DEMO BUILD
====================================================================
 This is a self-contained, single-file DEMO for quick preview on a
 phone browser with no server required. All data below is in-memory
 demo data (properties, agents, bookings, reviews, notifications) —
 nothing here is a real database, and nothing persists beyond this
 browser tab except what's explicitly saved to localStorage (theme,
 favorites, demo session).

 This is a companion to, NOT a replacement for, the real
 backend-connected build (Node/Express/Prisma/PostgreSQL API +
 separate customer/admin/agent apps) delivered earlier. Use this file
 when you just want to show the UI/UX on a phone with zero setup.

 ---------------------------------------------------------------
 FUTURE BACKEND MAPPING (for splitting into a real GitHub project)
 ---------------------------------------------------------------
 Each demo data block / JS module below is commented with where it
 maps in the real backend that already exists:

   DEMO_DB.properties      -> /backend/properties  (Property, PropertyImage, Amenity tables)
   DEMO_DB.agents          -> /backend/users        (Agent + User tables)
   DEMO_DB.customers       -> /backend/users        (User table, role=CUSTOMER)
   DEMO_DB.bookings        -> /backend/bookings      (Booking table)
   DEMO_DB.reviews         -> /backend/properties    (Review table)
   DEMO_DB.notifications   -> /backend/notifications (Notification table)
   DEMO_DB.messages        -> /backend/messages      (Conversation/Message tables)
   authState / login()     -> /backend/auth          (JWT access+refresh, OTP, PIN)
   adminState              -> /backend/admin         (role-gated admin routes)
   mediaLibrary            -> /backend/uploads       (media upload endpoint)
   exportJSON/importJSON   -> /backend/database      (backup/restore — real backend
                                                        would use pg_dump / migrations)
====================================================================
-->

<style>
  :root{
    --navy:#0B1F3A; --navy-deep:#061428; --gold:#D4AF37; --gold-deep:#B8912B;
    --charcoal:#2B2B2E; --charcoal-soft:#6B6B70; --white:#FFFFFF; --grey:#F4F5F7; --grey-line:#E7E8EC;
    --danger:#C0392B; --success:#2E7D5B; --warn:#B8860B;
    --radius:16px; --radius-sm:10px; --shadow:0 10px 30px rgba(11,31,58,0.10); --shadow-sm:0 4px 16px rgba(11,31,58,0.08);
    --bg:var(--grey); --surface:var(--white); --text:var(--charcoal); --text-soft:var(--charcoal-soft); --line:var(--grey-line);
  }
  [data-theme="dark"]{
    --bg:#0E1420; --surface:#161D2B; --text:#EDEFF5; --text-soft:#9AA3B5; --line:#252D3F;
    --shadow:0 10px 30px rgba(0,0,0,0.35); --shadow-sm:0 4px 16px rgba(0,0,0,0.3);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; background:var(--bg); color:var(--text);
    transition:background .25s ease, color .25s ease; overscroll-behavior-y:none;}
  a{text-decoration:none; color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  #app-shell{max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; overflow-x:hidden;
    box-shadow:0 0 60px rgba(0,0,0,0.15);}

  .screen{display:none; min-height:100vh; flex-direction:column; animation:fadeIn .35s ease;}

  // ---- Global event delegation ----
  document.body.addEventListener('click', function(e){
    var t = e.target.closest('[data-action]');
    if (!t || t.hasAttribute('data-noaction')) return;
    var tag = t.tagName.toLowerCase();
    if (tag === 'select' || (tag === 'input' && t.type === 'checkbox')) return; // handled by 'change' below
    var action = t.getAttribute('data-action');
    var arg = t.getAttribute('data-arg');
    handleAction(action, arg, t, e);
  });
  // Selects and checkboxes fire 'change', not a click on the new value — handle separately.
  document.body.addEventListener('change', function(e){
    var t = e.target.closest('select[data-action], input[type="checkbox"][data-action]');
    if (t){ handleAction(t.getAttribute('data-action'), t.getAttribute('data-arg'), t, e); return; }
    if (e.target.id === 'media-upload-input') handleMediaUpload(e.target);
    if (e.target.id === 'restore-file-input') handleRestoreUpload(e.target);
  });

  function handleMediaUpload(input){
    var file = input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var kind = file.type.startsWith('image/') ? 'image' : file.type.startsWith('video/') ? 'video' : 'document';
      DEMO_DB.mediaLibrary.unshift({ id: uid('m'), name: file.name, kind: kind, dataUrl: kind==='image' ? reader.result : null });
      logActivity('Media uploaded: ' + file.name);
      toast('File uploaded');
      render();
    };
    reader.readAsDataURL(file);
  }

  function handleRestoreUpload(input){
    var file = input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var parsed = JSON.parse(reader.result);
        if (parsed.DEMO_DB) Object.assign(DEMO_DB, parsed.DEMO_DB);
        if (parsed.SITE_CONTENT) Object.assign(SITE_CONTENT, parsed.SITE_CONTENT);
        if (parsed.FAQS) { FAQS.length = 0; parsed.FAQS.forEach(function(f){ FAQS.push(f); }); }
        logActivity('Data restored from backup file');
        toast('Backup restored successfully');
        render();
      } catch (err) { toast('Invalid backup file', true); }
    };
    reader.readAsText(file);
  }

  ACTIONS['mortgage:calc'] = function(arg){
    var p = DEMO_DB.properties.find(function(x){ return x.id === arg; });
    var down = parseFloat(document.getElementById('mc-down').value) || 0;
    var rate = parseFloat(document.getElementById('mc-rate').value) || 0;
    var years = parseInt(document.getElementById('mc-years').value, 10) || 1;
    var principal = Math.max(p.price - down, 0);
    var monthlyRate = (rate/100) / 12;
    var n = years * 12;
    var payment = monthlyRate === 0 ? principal / n : principal * (monthlyRate * Math.pow(1+monthlyRate, n)) / (Math.pow(1+monthlyRate, n) - 1);
    document.getElementById('mc-result').textContent = 'Est. Monthly Payment: ' + money(payment, p.currency);
  };

  ADMIN_RENDERERS.analytics = function(){

    DEMO_DB.properties.forEach(function(p){ byStatus[p.status] = (byStatus[p.status]||0) + 1; });
    var maxCount = Math.max.apply(null, Object.values(byStatus).concat([1]));
    var barsHtml = Object.keys(byStatus).map(function(k){
      var pct = Math.round((byStatus[k]/maxCount)*100);
      return '<div style="margin-bottom:10px;"><div style="display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:3px;"><span>' + k + '</span><span>' + byStatus[k] + '</span></div>' +

    }).join('');
    var totalViews = DEMO_DB.properties.length * 37; // demo figure
    return '<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;">' +
      '<div class="card" style="padding:14px;"><div style="font-size:20px; font-weight:800;">' + totalViews + '</div><div style="font-size:11px; color:var(--text-soft);">Total Views (demo)</div></div>' +
      '<div class="card" style="padding:14px;"><div style="font-size:20px; font-weight:800;">' + DEMO_DB.reviews.length + '</div><div style="font-size:11px; color:var(--text-soft);">Total Reviews</div></div>' +
    '</div>' +
    '<p class="section-title">Properties by Status</p><div class="card" style="padding:14px;">' + barsHtml + '</div>';
  };

  ADMIN_RENDERERS.reports = function(){
    return '<div class="card" style="padding:14px; margin-bottom:12px;"><b style="font-size:13px;">Properties Report</b><div style="display:flex; gap:8px; margin-top:8px;"><button class="btn btn-outline btn-sm" data-action="admin:exportCsv" data-arg="properties">Export CSV</button></div></div>' +
      '<div class="card" style="padding:14px; margin-bottom:12px;"><b style="font-size:13px;">Customers Report</b><div style="display:flex; gap:8px; margin-top:8px;"><button class="btn btn-outline btn-sm" data-action="admin:exportCsv" data-arg="customers">Export CSV</button></div></div>' +
      '<div class="card" style="padding:14px;"><b style="font-size:13px;">Bookings Report</b><div style="display:flex; gap:8px; margin-top:8px;"><button class="btn btn-outline btn-sm" data-action="admin:exportCsv" data-arg="bookings">Export CSV</button></div></div>';
  };
  ACTIONS['admin:exportCsv'] = function(arg){
    var rows, headers;
    if (arg === 'properties'){ headers=['Title','Type','Purpose','Status','Price','City']; rows = DEMO_DB.properties.map(function(p){return [p.title,p.type,p.purpose,p.status,p.price,p.city];}); }
    else if (arg === 'customers'){ headers=['Name','Phone','Joined','Saved']; rows = DEMO_DB.customers.map(function(c){return [c.name,c.phone,c.joined,c.saved];}); }
    else { headers=['Customer','Property','Date','Status']; rows = DEMO_DB.bookings.map(function(b){var p=DEMO_DB.properties.find(function(x){return x.id===b.propertyId;}); return [b.customer, p?p.title:'', b.date, b.status];}); }
    var csv = [headers.join(',')].concat(rows.map(function(r){ return r.map(function(v){ var s=String(v==null?'':v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }).join(','); })).join('\n');
    var blob = new Blob([csv], {type:'text/csv'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'amis-' + arg + '-report.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast('Report downloaded');
  };

  ADMIN_RENDERERS.payments = function(){
    return '<table><thead><tr><th>Customer</th><th>Amount</th><th>Method</th><th>Status</th></tr></thead><tbody>' +
      DEMO_DB.payments.map(function(p){ return '<tr><td>' + escapeHtml(p.customer) + '</td><td>' + p.currency + ' ' + p.amount.toLocaleString() + '</td><td>' + p.method + '</td><td><span class="badge ' + (p.status==='PAID'?'available':'sold') + '">' + p.status + '</span></td></tr>'; }).join('') +
      '</tbody></table>' +
      '<p style="font-size:10.5px; color:var(--text-soft); margin-top:10px;">Demo transactions only — no real payment provider is connected.</p>';
  };

  ADMIN_RENDERERS.content = function(){
    return '<div class="field"><label>Hero Title</label><input type="text" id="ct-hero-title" value="' + escapeHtml(SITE_CONTENT.heroTitle) + '"></div>' +
      '<div class="field"><label>Hero Subtitle</label><textarea id="ct-hero-sub" rows="2">' + escapeHtml(SITE_CONTENT.heroSubtitle) + '</textarea></div>' +
      '<div class="field"><label>Announcement Banner</label><input type="text" id="ct-announcement" value="' + escapeHtml(SITE_CONTENT.announcement) + '"></div>' +
      '<button class="btn btn-primary" data-action="admin:contentSave">Save — Updates Instantly on Home</button>';
  };
  ACTIONS['admin:contentSave'] = function(){
    SITE_CONTENT.heroTitle = document.getElementById('ct-hero-title').value;
    SITE_CONTENT.heroSubtitle = document.getElementById('ct-hero-sub').value;
    SITE_CONTENT.announcement = document.getElementById('ct-announcement').value;
    logActivity('Website content updated'); toast('Content updated'); render();
  };

  ADMIN_RENDERERS.roles = function(){
    var roles = [ ['Super Admin', ['All permissions']], ['Admin', ['Manage properties','Manage bookings','View reports']],
      ['Agent', ['Manage own listings','Manage own leads']], ['Customer', ['Browse & book']] ];
    return roles.map(function(r){
      return '<div class="card" style="padding:13px 15px; margin-bottom:10px;"><b style="font-size:13px;">' + r[0] + '</b>' +
        '<div style="margin-top:6px; display:flex; flex-wrap:wrap; gap:6px;">' + r[1].map(function(p){ return '<span class="cat-chip active" style="cursor:default;">' + p + '</span>'; }).join('') + '</div></div>';
    }).join('') + '<p style="font-size:10.5px; color:var(--text-soft); margin-top:8px;">Demo view — real role enforcement happens server-side (see backend README).</p>';
  };

  ADMIN_RENDERERS.logs = function(){
    return '<div class="row-list">' + DEMO_DB.activityLog.map(function(a){ return '<div class="item"><span style="color:var(--text-soft); font-size:11px; width:50px;">' + a.time + '</span><span style="font-size:12.5px;">' + escapeHtml(a.text) + '</span></div>'; }).join('') + '</div>';
  };

  ADMIN_RENDERERS.media = function(){
    var iconFor = { image:'🖼️', video:'🎬', document:'📄' };
    return '<div class="field"><label>Upload File</label><input type="file" id="media-upload-input" accept="image/*,video/*,.pdf"></div>' +
      '<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">' +
      DEMO_DB.mediaLibrary.map(function(m){
        return '<div class="card" style="padding:12px; text-align:center;">' + (m.dataUrl ? '<img src="'+m.dataUrl+'" style="width:100%; height:70px; object-fit:cover; border-radius:8px;">' : '<div style="font-size:30px;">' + iconFor[m.kind] + '</div>') +
          '<p style="font-size:10.5px; margin-top:6px; word-break:break-all;">' + escapeHtml(m.name) + '</p></div>';
      }).join('') + '</div>';
  };

  ADMIN_RENDERERS.faqs = function(){
    return '<div class="field"><label>Question</label><input type="text" id="faq-q"></div>' +
      '<div class="field"><label>Answer</label><textarea id="faq-a" rows="2"></textarea></div>' +
      '<button class="btn btn-primary" data-action="admin:faqAdd" style="margin-bottom:16px;">Add FAQ</button>' +
      FAQS.map(function(f,i){ return '<div class="card" style="padding:12px 14px; margin-bottom:8px;"><b style="font-size:12.5px;">' + escapeHtml(f.q) + '</b><p style="font-size:11.5px; color:var(--text-soft); margin:4px 0;">' + escapeHtml(f.a) + '</p><button class="btn btn-danger btn-sm" data-action="admin:faqDelete" data-arg="' + i + '">Delete</button></div>'; }).join('');
  };
  ACTIONS['admin:faqAdd'] = function(){
    var q = document.getElementById('faq-q').value.trim(), a = document.getElementById('faq-a').value.trim();
    if (!q || !a) { toast('Both fields are required', true); return; }
    FAQS.push({ q:q, a:a }); toast('FAQ added'); render();
  };
  ACTIONS['admin:faqDelete'] = function(arg){ FAQS.splice(parseInt(arg,10),1); toast('FAQ removed'); render(); };

  ADMIN_RENDERERS.support = function(){
    return DEMO_DB.supportTickets.map(function(tk){
      return '<div class="card" style="padding:12px 14px; margin-bottom:10px;"><div style="display:flex; justify-content:space-between;"><b style="font-size:12.5px;">' + escapeHtml(tk.customer) + '</b><span class="badge ' + (tk.status==='OPEN'?'sold':'available') + '">' + tk.status + '</span></div>' +
        '<p style="font-size:12px; margin:4px 0;">' + escapeHtml(tk.subject) + '</p>' +
        '<button class="btn btn-outline btn-sm" data-action="admin:ticketResolve" data-arg="' + tk.id + '">Mark Resolved</button></div>';
    }).join('') || '<div class="empty-state">No support tickets.</div>';
  };
  ACTIONS['admin:ticketResolve'] = function(arg){
    var tk = DEMO_DB.supportTickets.find(function(x){return x.id===arg;});
    if (tk){ tk.status = 'RESOLVED'; toast('Ticket resolved'); render(); }
  };

  ADMIN_RENDERERS.health = function(){
    var checks = [ ['API Server','Operational'], ['Database','Operational'], ['Media Storage','Operational'], ['Notifications','Operational'] ];
    return checks.map(function(c){ return '<div class="card" style="padding:12px 15px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;"><span style="font-size:13px;">' + c[0] + '</span><span class="badge available">' + c[1] + '</span></div>'; }).join('') +
      '<p style="font-size:10.5px; color:var(--text-soft); margin-top:10px;">Simulated status for this demo — the real backend exposes /api/health.</p>';
  };

  ADMIN_RENDERERS.backup = function(){
    return '<div class="card" style="padding:16px; margin-bottom:14px;"><b style="font-size:13px;">Export / Backup</b>' +
      '<p style="font-size:11.5px; color:var(--text-soft); margin:6px 0 10px;">Downloads all demo data (properties, customers, bookings, etc.) as a JSON file.</p>' +
      '<button class="btn btn-outline" data-action="admin:exportJson">Export Full Backup (JSON)</button></div>' +
      '<div class="card" style="padding:16px;"><b style="font-size:13px;">Import / Restore</b>' +
      '<p style="font-size:11.5px; color:var(--text-soft); margin:6px 0 10px;">Restores demo data from a previously exported JSON file.</p>' +
      '<input type="file" id="restore-file-input" accept="application/json"></div>';
  };
  ACTIONS['admin:exportJson'] = function(){
    var payload = JSON.stringify({ DEMO_DB: DEMO_DB, SITE_CONTENT: SITE_CONTENT, FAQS: FAQS }, null, 2);
    var blob = new Blob([payload], {type:'application/json'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'amis-properties-backup.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    logActivity('Full backup exported'); toast('Backup downloaded');
  };









  /* ================= BOOT ================= */
  render(); // shows splash immediately

})();
</script>
</body>
</html>
